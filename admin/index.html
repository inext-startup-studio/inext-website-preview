<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>INEXT — Administration du contenu</title>
  </head>
  <body>
    <!--
      Sveltia CMS (https://sveltiacms.app) — the editing UI for everything under /content.
      Lives in public/ so the static export copies it verbatim to out/admin/. Sveltia
      resolves config.yml relative to its own location, so the page needs no basePath
      handling: it works from the domain root both sites are served from today, and
      equally from a repository subpath if PREVIEW_BASE_PATH ever builds for one.

      The version is pinned rather than tracking the CDN's latest: a CMS release that
      changed behavior would otherwise reach editors unannounced. Bump deliberately,
      checking https://github.com/sveltia/sveltia-cms/releases.

      The integrity hash pins the bytes as well as the version — this page hands out
      tokens with write access to the repository, so a compromised CDN response would
      be worth someone's while. Recompute it whenever the version changes:
        curl -sL <the src below> | openssl dgst -sha384 -binary | openssl base64 -A
      Renovate bumps the version and not the hash, so its PR always needs this.
      `npm run check:sri` fails on a stale hash and prints the right one; the PR check
      and both publish workflows run it.
    -->
    <script
      src="https://unpkg.com/@sveltia/cms@0.261.0/dist/sveltia-cms.js"
      integrity="sha384-sty7BGmg7YGd6Wi3G73SvUYWcNE6vztGSEklT7ZI8T/3JSshWKHKH7HuUk99s/HJ"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
