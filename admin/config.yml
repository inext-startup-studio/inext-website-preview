# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

# Sveltia CMS (https://sveltiacms.app) — content model for the editing UI.
#
# This describes the same model that src/lib/content.ts validates at build time with
# Zod, and the two must stay aligned in both directions:
#   - a field described here but absent from Zod is silently dropped when the site builds;
#   - a field Zod requires but missing here is erased from the file the first time an
#     editor saves that entry, and the next build fails.
# Editor-facing strings are French, like the site and its editors; comments are English,
# like the rest of the repository.

backend:
  name: github
  repo: inext-startup-studio/inext-website
  # The publish workflow watches this branch, so saving in the CMS republishes the
  # board preview. Deliberately not the production branch: edits are reviewed on the
  # preview site and reach production by merging, so the CMS targets `preview` even
  # when it is opened from the production host.
  branch: preview
  # The site is a static export with no server of its own, so the OAuth code-for-token
  # exchange runs in a Cloudflare Worker (github.com/sveltia/sveltia-cms-auth).
  base_url: https://sveltia-cms-auth.stephaneberle9.workers.dev
  # Sent to the worker as `site_id` and matched against its ALLOWED_DOMAINS: an identity
  # for this CMS deployment rather than the address it is served from. Pinning it — the
  # fallback is the browser's hostname, `cms.netlify.com` on localhost — is what lets the
  # same admin page authenticate from the preview host, from a future inext.icu and from
  # localhost. It has to appear verbatim in ALLOWED_DOMAINS, so the two change together
  # or sign-in fails with UNSUPPORTED_DOMAIN. That the pinned value names the preview
  # host mirrors what `branch` above nails down — this CMS edits the preview wherever it
  # is served from. Only `branch` enforces that, though; this option cannot affect where
  # content lands.
  site_domain: preview.inext.icu
  # Commits are authored by whoever is signed in and GPG-signed by GitHub itself
  # (Sveltia writes through the GraphQL createCommitOnBranch mutation), so they pass a
  # signature requirement without editors holding keys.
  commit_messages:
    create: "content: add {{path}} (via Sveltia CMS)"
    update: "content: update {{path}} (via Sveltia CMS)"
    delete: "content: remove {{path}} (via Sveltia CMS)"
    uploadMedia: "content: add asset {{path}} (via Sveltia CMS)"
    deleteMedia: "content: remove asset {{path}} (via Sveltia CMS)"

# Artwork lives in the repository next to the content. `public_folder` is what gets
# written into the files: site-absolute "/assets/…" paths, which prefixAssets() in
# src/lib/content.ts rewrites for the deployment's base path at render time.
media_folder: /public/assets
public_folder: /assets

output:
  # content.ts marks many fields `.optional()`. Writing them as empty strings would
  # break the stricter ones — `z.string().url()` rejects "" — so leave them out
  # entirely and let Zod's defaults apply. Note that `false` and `0` are not "empty".
  omit_empty_optional_fields: true

slug:
  # Keeps generated file names ASCII, e.g. "Éric Valat" -> eric-valat.md.
  clean_accents: true

# Enables the "view on the site" links in the editor. It stays the preview site once
# production exists: what an editor just saved is on `preview`, and only reaches
# production on merge.
#
# Careful when changing this: Sveltia keeps only the *origin* of this URL for per-entry
# preview links (`new URL(site_url).origin`), so anything below the host is dropped and
# each `preview_path` below has to carry it instead. Nothing to carry while the preview
# is served from the root of its own domain — but a move back to a repository subpath
# would need the subpath in every `preview_path`, or the links 404.
site_url: https://preview.inext.icu

# ── Pages ────────────────────────────────────────────────────────────────────
#
# Both pages are a list of typed blocks. The discriminant is `type`, Sveltia's default
# `typeKey`, and its values match the members of blockSchema in content.ts.
#
# YAML anchors below (&name / *name) declare each repeated field once. Sveltia resolves
# aliases when it parses this file.

singletons:
  - name: home
    label: "Page d'accueil"
    file: content/pages/home.md
    icon: home
    format: yaml-frontmatter
    # Must stay non-empty: Sveltia drops the "view on the site" link entirely when
    # `preview_path` is unset or empty, and "/" resolves to the site root.
    preview_path: /
    fields:
      - &page_title
        name: title
        label: Titre (onglet du navigateur)
        widget: string
      - &page_description
        name: description
        label: Description (référencement)
        widget: text
        required: false
      - &page_blocks
        name: blocks
        label: Blocs
        label_singular: Bloc
        widget: list
        collapsed: true
        summary: "{{fields.type}} — {{fields.heading}}{{fields.title}}"
        types:
          # ── hero ──
          - name: hero
            label: "Hero (bandeau d'accueil)"
            widget: object
            fields:
              - &kicker
                name: kicker
                label: Sur-titre
                widget: string
              - name: title
                label: Titre
                widget: string
                hint: "« | » force un retour à la ligne, *texte* passe en orange."
              - name: text
                label: Texte
                widget: text
              - name: ctas
                label: Boutons
                label_singular: Bouton
                widget: list
                required: false
                summary: "{{fields.label}}"
                fields: &cta_fields
                  - name: label
                    label: Libellé
                    widget: string
                  - name: href
                    label: Lien
                    widget: string
                    hint: "Page interne (/contact/) ou ancre (/#notreprogramme)."
                  - name: variant
                    label: Style
                    widget: select
                    default: primary
                    options:
                      - { label: "Orange (principal)", value: primary }
                      - { label: "Contour (secondaire)", value: ghost }
                      - { label: "Sombre (sur bannière)", value: dark }
              - name: motif
                label: Motif graphique en fond
                widget: boolean
                default: true

          # ── portfolio ──
          - name: portfolio
            label: Portefeuille (participations)
            widget: object
            fields:
              - &anchor
                name: anchor
                label: Ancre
                widget: string
                required: false
                hint: "Identifiant utilisé par les liens /#… du menu."
              - *kicker
              - &heading
                name: heading
                label: Titre
                widget: string
              - name: countLabel
                label: Libellé du compteur
                widget: string
                required: false
              - name: moreTile
                label: Tuile finale
                widget: object
                required: false
                collapsed: auto
                hint: "Les autres tuiles proviennent de la collection « Participations »."
                fields:
                  - name: title
                    label: Titre
                    widget: string
                  - name: href
                    label: Lien
                    widget: string

          # ── programme ──
          - name: programme
            label: Programme (cartes)
            widget: object
            fields:
              - *anchor
              - *kicker
              - *heading
              - &intro
                name: intro
                label: Introduction
                widget: text
                required: false
              - &art_image
                name: image
                label: Illustration
                widget: image
                required: false
                media_folder: /public/assets/art
                public_folder: /assets/art
              - &art_image_alt
                name: imageAlt
                label: Texte alternatif de l'illustration
                widget: string
                required: false
                default: ""
              - name: cards
                label: Cartes
                label_singular: Carte
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - name: icon
                    label: Icône
                    widget: image
                    media_folder: /public/assets
                    public_folder: /assets
                  - name: title
                    label: Titre
                    widget: string
                  - name: text
                    label: Texte
                    widget: text
                  - name: accent
                    label: Carte mise en avant
                    widget: boolean
                    default: false
                  - name: url
                    label: Lien
                    widget: string
                    required: false

          # ── textSection ──
          - name: textSection
            label: Section texte + image
            widget: object
            fields:
              - *anchor
              - *kicker
              - *heading
              - name: text
                label: Texte
                widget: text
              - name: cta
                label: Bouton
                widget: object
                required: false
                collapsed: auto
                fields: *cta_fields
              - *art_image
              - *art_image_alt
              - name: imagePos
                label: Position de l'illustration
                widget: select
                default: right
                options:
                  - { label: À droite, value: right }
                  - { label: À gauche, value: left }

          # ── partners ──
          - name: partners
            label: Partenaires
            widget: object
            fields:
              - *anchor
              - *kicker
              - *heading
              - name: intro
                label: Introduction
                widget: text
                required: false
                hint: "Les logos proviennent de la collection « Partenaires »."

          # ── contact ──
          - name: contact
            label: Formulaire de contact
            widget: object
            fields:
              - *anchor
              - *kicker
              - *heading
              - *intro
              - name: bullets
                label: Points clés
                label_singular: Point
                widget: list
                required: false
                summary: "{{fields.text}}"
                hint: "Affichés à côté du formulaire : ce que le visiteur peut venir chercher."
                fields:
                  - name: text
                    label: Texte
                    widget: string
              - *art_image
              - *art_image_alt
              - name: formTitle
                label: Titre du formulaire
                widget: string
                default: Contactez-nous
              - name: formIntro
                label: Introduction du formulaire
                widget: text
                required: false
              - name: subjects
                label: Objets de demande proposés
                label_singular: Objet
                widget: list
                required: false
                summary: "{{fields.label}}"
                hint: "Options de la liste déroulante. Vide = le champ n'apparaît pas."
                fields:
                  - name: label
                    label: Libellé
                    widget: string
              - name: consent
                label: Case de consentement
                widget: object
                required: false
                collapsed: auto
                hint: "Vide = aucune case à cocher sous le formulaire."
                fields:
                  - name: text
                    label: Texte
                    widget: string
                    hint: "Précède le lien, sans le point final."
                  - name: linkLabel
                    label: Libellé du lien
                    widget: string
                  - name: href
                    label: Lien
                    widget: string

          # ── ctaBanner ──
          - name: ctaBanner
            label: "Bannière d'appel à l'action"
            widget: object
            fields:
              - *heading
              - name: cta
                label: Bouton
                widget: object
                fields: *cta_fields

          # ── stats ──
          - name: stats
            label: Chiffres clés
            widget: object
            fields:
              - name: items
                label: Chiffres
                label_singular: Chiffre
                widget: list
                summary: "{{fields.value}} — {{fields.label}}"
                fields:
                  - name: value
                    label: Valeur
                    widget: string
                  - name: label
                    label: Légende
                    widget: string

          # ── members ──
          - name: members
            label: Membres du comité
            widget: object
            fields:
              - *kicker
              - *heading
              - name: intro
                label: Introduction
                widget: text
                required: false
                hint: "Les portraits proviennent de la collection « Comité de surveillance »."

          # ── prose ──
          - name: prose
            label: "Texte long (mentions légales, etc.)"
            widget: object
            fields:
              - &prose_body
                name: body
                label: Contenu
                widget: markdown
                # No image component: markdown is rendered as-is, and prefixAssets()
                # does not reach inside it to apply the deployment's base path.
                editor_components: []

          # ── spotlight ──
          - name: spotlight
            label: Encadré éditorial
            widget: object
            fields:
              - *anchor
              - *heading
              - name: callout
                label: Accroche
                widget: string
                required: false
              - *prose_body
              - *art_image
              - *art_image_alt

          # ── eventsTeaser ──
          # The card itself comes from the « Événements » collection: the next upcoming
          # event, or nothing at all when there is none.
          - name: eventsTeaser
            label: "Prochain événement (accueil)"
            widget: object
            fields:
              - *anchor
              - *kicker
              - *heading
              - name: allLabel
                label: Lien vers la page des événements
                widget: string
                default: "Tous les événements →"
              - name: detailsLabel
                label: Libellé du bouton de la carte
                widget: string
                default: "Détails →"

          # ── eventsList ──
          # Every text here is the same for every event; what changes per event lives
          # in the collection. Rules for what an event may say: .claude/skills/site-events.
          - name: eventsList
            label: "Liste des événements (page Événements)"
            widget: object
            fields:
              - *anchor
              - *kicker
              - *heading
              - *intro
              - name: featuredLabel
                label: Étiquette de l'événement en vedette
                widget: string
                default: Prochain événement
              - name: programmeHeading
                label: Titre du déroulé
                widget: string
                default: Déroulé de la journée
              - name: programmeNote
                label: Note sous le déroulé
                widget: text
                default: Le programme détaillé et la liste des intervenants sont communiqués aux invités avec leur invitation.
              - name: registrationKicker
                label: Sur-titre de l'encart d'inscription
                widget: string
                default: Vous êtes invité ?
              - name: registrationHeading
                label: Titre de l'encart d'inscription
                widget: string
                default: Confirmez votre présence
              - name: registrationText
                label: Texte de l'encart d'inscription
                widget: text
                default: Les invitations sont nominatives. Si vous avez reçu la vôtre, dites-nous que vous serez là ; nous vous renverrons les informations pratiques.
              - name: emptyUpcoming
                label: Texte quand aucun événement n'est à venir
                widget: string
                default: Aucun événement n'est programmé pour le moment.
              - name: pastKicker
                label: Sur-titre des éditions précédentes
                widget: string
                default: Archives
              - name: pastHeading
                label: Titre des éditions précédentes
                widget: string
                default: Éditions précédentes
              - name: emptyPast
                label: Texte quand aucune édition n'est passée
                widget: string
                default: Les éditions passées apparaîtront ici, avec un bref compte rendu.

  - name: a-propos-page
    label: Page À propos
    file: content/pages/a-propos.md
    icon: info
    format: yaml-frontmatter
    preview_path: a-propos/
    fields:
      - *page_title
      - *page_description
      - *page_blocks

  - name: comite-page
    label: Page Comité
    file: content/pages/comite.md
    icon: groups
    format: yaml-frontmatter
    # Must stay non-empty: Sveltia drops the "view on the site" link entirely when
    # `preview_path` is unset or empty.
    preview_path: comite/
    fields:
      - *page_title
      - *page_description
      - *page_blocks

  - name: charte-ethique-page
    label: Charte éthique
    file: content/pages/charte-ethique.md
    icon: verified
    format: yaml-frontmatter
    preview_path: charte-ethique/
    fields:
      - *page_title
      - *page_description
      - *page_blocks

  - name: contact-page
    label: Page Contact
    file: content/pages/contact.md
    icon: mail
    format: yaml-frontmatter
    preview_path: contact/
    fields:
      - *page_title
      - *page_description
      - *page_blocks

  - name: evenements-page
    label: Page Événements
    file: content/pages/evenements.md
    icon: event
    format: yaml-frontmatter
    preview_path: evenements/
    fields:
      - *page_title
      - *page_description
      - *page_blocks

  - name: mentions-legales-page
    label: Mentions légales
    file: content/pages/mentions-legales.md
    icon: gavel
    format: yaml-frontmatter
    preview_path: mentions-legales/
    fields:
      - *page_title
      - *page_description
      - *page_blocks

  - name: confidentialite-page
    label: Politique de confidentialité
    file: content/pages/politique-de-confidentialite.md
    icon: privacy_tip
    format: yaml-frontmatter
    preview_path: politique-de-confidentialite/
    fields:
      - *page_title
      - *page_description
      - *page_blocks

  - divider: true

  # ── Réglages ───────────────────────────────────────────────────────────────
  - name: site
    label: Réglages du site
    file: content/global/site.json
    icon: settings
    format: json
    fields:
      - name: siteTitle
        label: Nom du site
        widget: string
      - name: tagline
        label: Signature
        widget: string
      - name: description
        label: Description (référencement)
        widget: text
      - name: nav
        label: Menu de navigation
        label_singular: Entrée
        widget: list
        summary: "{{fields.label}}"
        fields:
          - name: label
            label: Libellé
            widget: string
          - name: href
            label: Lien
            widget: string
          - name: button
            label: Afficher en bouton
            widget: boolean
            default: false
      - name: social
        label: Réseaux sociaux
        widget: object
        fields:
          - name: linkedin
            label: LinkedIn
            widget: string
            type: url
      - name: announcement
        label: Bandeau d'annonce
        widget: select
        default: ribbon
        hint: "Annonce le prochain événement au-dessus de l'en-tête, sur toutes les pages. N'apparaît que lorsqu'un événement est à venir."
        options:
          - { label: "Affiché", value: ribbon }
          - { label: "Masqué", value: none }
      - name: contact
        label: Contact
        widget: object
        fields:
          # Declared only so that saving this file does not drop it: Sveltia rewrites
          # the whole file from the fields described here.
          - name: _note
            label: Note interne
            widget: string
            required: false
            readonly: true
          - name: email
            label: Adresse e-mail de réception
            widget: string
            type: email
          - name: formAction
            label: Endpoint du formulaire
            widget: string
            required: false
            readonly: true
            hint: "Réglage technique. Vide = le formulaire ouvre le client mail du visiteur."
      - name: footer
        label: Pied de page
        widget: object
        fields:
          - name: note
            label: Mention
            widget: string
          - name: columns
            label: Colonnes de liens
            label_singular: Colonne
            widget: list
            required: false
            summary: "{{fields.title}}"
            fields:
              - name: title
                label: Titre de la colonne
                widget: string
              - name: links
                label: Liens
                label_singular: Lien
                widget: list
                required: false
                summary: "{{fields.label}}"
                fields: &footer_link_fields
                  - name: label
                    label: Libellé
                    widget: string
                  - name: href
                    label: Lien
                    widget: string
          - name: legalLinks
            label: Liens légaux (ligne du bas)
            label_singular: Lien
            widget: list
            required: false
            summary: "{{fields.label}}"
            hint: "Affichés à côté de la mention de copyright, tout en bas."
            fields: *footer_link_fields

# ── Collections ──────────────────────────────────────────────────────────────
#
# One file per item, ordered by the `order` field — the same field the drag-and-drop
# reordering writes, numbered from 1. File names are derived from `name`.

collections:
  - name: startups
    label: Participations
    label_singular: Participation
    icon: workspaces
    folder: content/startups
    format: yaml-frontmatter
    extension: md
    identifier_field: name
    thumbnail: logo
    reorder: true
    sortable_fields:
      fields: [order, name]
      default: { field: order, direction: ascending }
    fields:
      - &item_name
        name: name
        label: Nom
        widget: string
      - &item_description
        name: description
        label: Description
        widget: string
        required: false
      - &item_url
        name: url
        label: Site web
        widget: string
        type: url
        required: false
        hint: "URL complète (https://…). Laisser vide si aucune."
      - name: logo
        label: Logo
        widget: image
        media_folder: /public/assets/portfolio
        public_folder: /assets/portfolio
      - name: neonLogo
        label: Logo néon (variante lumineuse)
        widget: image
        required: false
        media_folder: /public/assets/portfolio/neon
        public_folder: /assets/portfolio/neon
      - &item_order
        name: order
        label: Ordre d'affichage
        widget: number
        value_type: int
        min: 1
        hint: "Se règle aussi par glisser-déposer depuis la liste."
      - name: tile
        label: Réglages de la tuile
        widget: object
        collapsed: true
        hint: Ajustements fins pour équilibrer visuellement les logos entre eux.
        fields:
          - name: padding
            label: Marge intérieure (px)
            widget: number
            value_type: int
            default: 22
            min: 0
            max: 60
          - name: maxHeight
            label: Hauteur max du logo (px)
            widget: number
            value_type: int
            default: 64
            min: 20
            max: 140
          - name: neonWidth
            label: Largeur du logo néon (% de la tuile)
            widget: number
            value_type: float
            required: false
            min: 10
            max: 100

  - name: partners
    label: Partenaires
    label_singular: Partenaire
    icon: handshake
    folder: content/partners
    format: yaml-frontmatter
    extension: md
    identifier_field: name
    thumbnail: logo
    reorder: true
    sortable_fields:
      fields: [order, name]
      default: { field: order, direction: ascending }
    fields:
      - *item_name
      - *item_description
      - *item_url
      - name: logo
        label: Logo
        widget: image
        media_folder: /public/assets/partners
        public_folder: /assets/partners
      - *item_order

  - name: board
    label: Comité de surveillance
    label_singular: Membre
    icon: badge
    folder: content/board
    format: yaml-frontmatter
    extension: md
    identifier_field: name
    thumbnail: photo
    reorder: true
    sortable_fields:
      fields: [order, name]
      default: { field: order, direction: ascending }
    fields:
      - *item_name
      - name: roles
        label: Rôles
        widget: string
        hint: "Séparés par des virgules, ex. « Stratégie, Technologie, Commerce »."
      - name: url
        label: Profil LinkedIn
        widget: string
        type: url
        required: false
        hint: "URL complète (https://…). Laisser vide si aucune."
      - name: photo
        label: Portrait
        widget: image
        media_folder: /public/assets/board
        public_folder: /assets/board
      - *item_order

  # One file per event, sorted by date. What an entry may say in public — and what must
  # stay in the invitation — is decided in .claude/skills/site-events/SKILL.md; the
  # hints below are the short form. There is deliberately no field for a detailed
  # agenda or a list of speakers.
  - name: events
    label: Événements
    label_singular: Événement
    icon: event
    folder: content/events
    format: yaml-frontmatter
    extension: md
    identifier_field: title
    sortable_fields:
      fields: [start, title]
      default: { field: start, direction: descending }
    fields:
      - name: title
        label: Titre
        widget: string
        hint: "Le nom de l'édition, année comprise : « SYMPOSIUM INEXT 2026 »."
      - name: start
        label: Début
        widget: datetime
        format: YYYY-MM-DDTHH:mm:ssZ
      - name: end
        label: Fin
        widget: datetime
        format: YYYY-MM-DDTHH:mm:ssZ
        required: false
        hint: "Vide = l'événement se termine à la fin de sa journée."
      - name: venue
        label: Lieu
        widget: string
      - name: venueUrl
        label: Site du lieu
        widget: string
        required: false
        pattern: ["^https://", "L'adresse doit commencer par https://"]
        hint: "Le site du lieu, lien externe. Vide = le nom du lieu n'est pas cliquable."
      - name: address
        label: Adresse
        widget: string
        required: false
      - name: city
        label: Ville
        widget: string
      - name: access
        label: Accès
        widget: select
        default: invitation
        options:
          - { label: Sur invitation, value: invitation }
          - { label: Sur inscription, value: inscription }
          - { label: Entrée libre, value: libre }
      - name: audience
        label: Public
        widget: string
        required: false
        hint: "Qui est invité, au complet : « Associés, partenaires et startups ». Le champ « Accès » dit déjà « Sur invitation », inutile de le répéter. Court : le libellé s'affiche en pastille, sur une seule ligne."
      - name: summary
        label: Présentation
        widget: text
        hint: "Le genre de la journée, en une ou deux phrases. Jamais de nom de startup, jamais de mention de levée de fonds."
      - name: programme
        label: Déroulé
        label_singular: Étape
        widget: list
        required: false
        summary: "{{fields.slot}} — {{fields.text}}"
        hint: "À grands traits (« Matin », « Journée »). Pas de créneau horaire associé à un intervenant, pas de nom de startup."
        fields:
          - name: slot
            label: Moment
            widget: string
          - name: text
            label: Contenu
            widget: string
      - name: registration
        label: Confirmation de présence
        widget: object
        required: false
        collapsed: auto
        hint: "Vide = pas de bouton. L'objet doit exister dans la liste « Objets de demande proposés » de la page Contact."
        fields:
          - name: label
            label: Libellé du bouton
            widget: string
          - name: subject
            label: Objet pré-sélectionné dans le formulaire
            widget: string
      - name: recap
        label: Compte rendu (après l'événement)
        widget: markdown
        required: false
        editor_components: []
        hint: "Deux à quatre phrases, sans chiffres ni noms de startups. Affiché dans « Éditions précédentes »."

